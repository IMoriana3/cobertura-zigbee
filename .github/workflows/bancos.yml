name: bancos

# Los bancos se corrían a mano, y son veinticuatro. En la práctica eso significa
# que un cambio se podía subir sin que nadie los hubiera pasado, y que los que
# nadie recordaba no se pasaban nunca.
#
# Se reparten por lo que NECESITA cada uno, no por temas: los que solo leen
# ficheros van juntos y tardan segundos; los que abren navegador van en matriz,
# uno por job, para que un rojo diga cuál sin abrir el log; y los que ejecutan
# los .ps1 de verdad van aparte, porque necesitan PowerShell — que aquí no hay
# y en el runner sí, así que en CI se prueban por primera vez.

# TOPE DE TIEMPO POR JOB. Sin `timeout-minutes` GitHub deja correr SEIS HORAS.
# El dia que un banco se cuelgue —y con un navegador es cuestion de tiempo— eso
# es un runner atascado media jornada y un rojo que llega tardisimo. Los topes
# de abajo salen de lo MEDIDO en el runner, no de una corazonada:
#
#   nucleo 36 s · pwsh 14 s · datos 5 min 29 s   (al montar este CI)
#   datos 17 min 46 s                             (2026-09-19, run 257)
#   visor: ocho de los diez por debajo de 100 s, y los dos gordos
#          (test_equipos 24 min 26 s, test_panel_plegable parecido) — aqui esos
#          mismos tardan ~5 min, o sea que el runner iba 5 veces mas lento.
#
# LA CIFRA DE `datos` SE HA TRIPLICADO desde que se escribió y nadie se enteró,
# porque un número sin fecha al lado envejece en silencio. Por eso van las dos,
# cada una con cuándo se midió, y por eso la nueva lleva la suya. De los
# 17 min 46 s de hoy, 109 s son los dos bancos de herramientas de campo que
# entran en esta tanda; el resto ya estaba.
#
# Y OJO CON EL ×5 DE ARRIBA: vale para los bancos de NAVEGADOR, que es donde se
# midió. Para node sin navegador el factor va al revés — `test_herramientas_campo`
# tarda 144 s aquí y 109 s en el runner, o sea 0,76×. Un factor medido en una
# clase de trabajo no se lleva a otra.
#
# Asi que el tope del visor va en 45 min: casi el doble del peor caso medido, y
# aun asi ocho veces menos que las seis horas de fabrica.

on:
  push:
    branches: [main]
  pull_request:

# Un empujón nuevo cancela la ejecución anterior de la misma rama: lo que
# interesa es el estado de AHORA, no la cola.
concurrency:
  group: bancos-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── lo que solo lee ficheros: física, calibración y reparto ───────────────
  #
  # OJO AL HERMANO. `plan_barrido_rf.py` y `calibra_barrido.py` importan la
  # física RF de `../cobertura-rf-fv/python` — un repo HERMANO— y, si no está,
  # se lo tragan en silencio (`Z = None`) y siguen: el planificador emite la
  # hoja sin márgenes previstos ni pasada de canto. La hoja parece una hoja y
  # está hueca. Montando este CI se vio en un checkout limpio, con un
  # `ZeroDivisionError` que no decía nada; y lo grave no era el traceback, sino
  # que las comprobaciones que de verdad importan (la correlación distancia vs
  # mesas, y «las palas de canto tapan más») no comprueban NADA sin el núcleo.
  #
  # Los dos bancos ahora lo EXIGEN y dicen dónde lo buscan. Aquí se les da:
  # los dos repos se sacan uno al lado del otro dentro del espacio de trabajo,
  # que es la única forma de que `../cobertura-rf-fv` exista en el runner.
  # `cobertura-rf-fv` es público, así que basta el token de serie.
  nucleo:
    timeout-minutes: 15
    name: núcleo (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cobertura-zigbee
    steps:
      - uses: actions/checkout@v4
        with: { path: cobertura-zigbee }
      - name: el núcleo RF, de hermano
        uses: actions/checkout@v4
        with:
          repository: IMoriana3/cobertura-rf-fv
          path: cobertura-rf-fv
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # `gen_coords_cobertura.py` proyecta coordenadas con pyproj — la unica
      # dependencia externa que necesita ninguno de estos bancos (rastreado
      # import a import; los otros cuatro van con la biblioteca estandar). Va
      # pinchada, por lo mismo que Playwright: que una version nueva no cambie
      # el resultado sin que el repo haya cambiado.
      - name: pyproj (lo pide gen_coords_cobertura)
        run: python3 -m pip install --disable-pip-version-check pyproj==3.7.2
      - name: barrido RF
        run: python3 tools/test_barrido_rf.py
      - name: ajuste censurado (Tobit) del barrido
        run: python3 tools/test_calibra_barrido.py
      - name: TCUs retiradas y huecos de esclavo
        run: python3 tools/test_coords_retiradas.py

      # DOS COSAS QUE ROMPEN UN .ps1 EN EL PC DE UNA PLANTA, las dos encontradas
      # por el job de Windows y las dos invisibles bajo `pwsh` 7:
      #   · no-ASCII sin BOM → 5.1 lo lee como Windows-1252 y el fichero NI
      #     COMPILA: la raya dentro de una cadena se le vuelve comilla de cierre
      #   · `Invoke-WebRequest` sin `-UseBasicParsing` → 5.1 parsea con el motor
      #     de Internet Explorer, y sin IE revienta
      # Va aquí y no en el job de Windows porque no necesita PowerShell: así el
      # aviso llega en segundos en vez de esperar al runner.
      - name: los .ps1 no se rompen en el PC de una planta
        run: python3 tools/gate_ps1_planta.py

      # UN BANCO NO ESCRIBE EN EL REPO. `test_barrido_rf.py` corria el
      # planificador sin `--salida` y reescribia DIEZ hojas de barrido de campo
      # dentro del repo, en silencio; me apareceieron dos veces en `git status`
      # y estuvieron a punto de colarse en un commit. Arreglado, y vigilado:
      # si un banco vuelve a ensuciar el arbol, esto se pone rojo y dice cual.
      - name: los bancos no han tocado el repo
        run: |
          if ! git diff --quiet; then
            echo "Un banco ha modificado ficheros del repo:"; git diff --stat; exit 1
          fi

  # ── los .ps1, ejecutados de verdad ────────────────────────────────────────
  # `pwsh` viene de serie en ubuntu-latest. Los bancos lo buscan en el PATH
  # (o en $PWSH) y, si no está, se saltan diciéndolo — que es justo lo que pasa
  # en la máquina de desarrollo. Aquí SÍ corren.
  #
  # LAS MUTACIONES SE CORREN AQUÍ, no a mano. Un banco que nadie ha visto fallar
  # no es un banco, y comprobarlo una vez el día que se escribe no sirve: basta
  # que alguien afloje una comprobación para que se quede verde para siempre sin
  # que nadie se entere. Así que cada mutación se pone y se EXIGE rc = 1.
  # Exactamente 1, no «distinto de cero»: rc = 2 es «no hay pwsh» o «la mutación
  # ya no casa con el código», y contarlo como cazada sería el falso verde que
  # esto viene a evitar.
  powershell:
    timeout-minutes: 15
    name: scripts de campo (pwsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: pwsh está
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: ángulos del barrido (zigbee_angulos.ps1)
        run: python3 tools/test_angulos_barrido.py
      - name: inventario zigbee (zigbee_inventario.ps1)
        run: python3 tools/test_inventario_zb.py
      - name: RSSI (zigbee_logger.ps1)
        run: python3 tools/test_logger_rssi.py
      - name: rutas por telnet (zigbee_routes_logger.ps1)
        run: python3 tools/test_rutas_telnet.py
      - name: qué hace ESTE PowerShell con Export-Csv y la codificación
        run: python3 tools/test_export_csv_esquema.py

      # ── Y LOS MISMOS BANCOS SOBRE LO QUE SE DESCARGA ──────────────────────
      # El técnico NO usa el .ps1 del repo: usa el que sale del ZIP de «Medir en
      # planta», y no es el mismo fichero — el paquete le pone el BOM y le
      # sustituye el CONFIG. Probar solo el del repo dejaba fuera todas esas
      # transformaciones, y por ahí se coló que el BOM SE PERDÍA al empaquetar
      # (`Response.text()` lo quita al decodificar y `TextEncoder` no lo
      # escribe), así que `zigbee_inventario.ps1` seguía sin compilar en 5.1
      # aunque el fichero del repo estuviera arreglado.
      #
      # El ZIP lo arma `tools/paquete_planta.mjs` con el MISMO bloque de
      # index.html que usa la página, y lo abre `zipfile` de Python: que lo lea
      # otro programa es parte de la prueba.
      - name: el paquete que se descarga en planta
        shell: bash
        run: |
          node tools/paquete_planta.mjs elburgo _medir.zip
          python3 -c "import zipfile; zipfile.ZipFile('_medir.zip').extractall('_paq')"
          ls -l _paq/elburgo
      - name: los recolectores DEL PAQUETE, con PowerShell
        shell: bash
        env:
          PS1_DIR: _paq/elburgo
        run: |
          python3 tools/test_angulos_barrido.py
          python3 tools/test_inventario_zb.py
          python3 tools/test_logger_rssi.py
          python3 tools/test_rutas_telnet.py
      - name: y las mutaciones de los dos, en rojo
        shell: bash
        run: |
          log=$(mktemp)
          rojo () {
            banco="$1"; shift
            for m in "$@"; do
              set +e
              MUTA="$m" $PY "$banco" > "$log" 2>&1
              rc=$?
              set -e
              if [ "$rc" -ne 1 ]; then
                echo "::error::$banco con la mutación «$m» salió rc=$rc; se esperaba 1 (banco en rojo)"
                tail -40 "$log"
                exit 1
              fi
              echo "  $banco · $m: roja, bien"
            done
          }
          rojo tools/test_logger_rssi.py  signo rol filtro caido carga sello
          rojo tools/test_rutas_telnet.py saltos coord iac separador puerto
        env:
          PY: python3

  # ── LOS MISMOS .ps1, EN LA VERSIÓN QUE CORRE EN PLANTA ───────────────────
  # El job de arriba usa `pwsh`, que es PowerShell 7. En el PC de la planta hay
  # **Windows PowerShell 5.1**: es lo que trae Windows, y allí no se instala nada
  # ni hay admin. Probar solo en 7 es probar otro intérprete y llamarlo el mismo.
  #
  # Y no es una diferencia teórica: es justo donde el bloque 2 va a apoyarse.
  #
  #   · `Export-Csv -Encoding UTF8` NO escribe lo mismo en las dos versiones
  #     (5.1 pone BOM; 7 no). `tools/test_export_csv_esquema.py` lo mide en vez
  #     de suponerlo, y por eso corre en los dos jobs.
  #   · La regla de rotación a `<nombre>.v1.<fecha>.csv` existe porque
  #     `Export-Csv -Append` rechaza una cabecera distinta. Esa regla se cumple
  #     o se incumple en 5.1, no en 7.
  #
  # MEDIDO: 64 s (2026-09-19, run 35474112229), con los cuatro bancos y las once
  # mutaciones dentro. El tope se queda en 10 min —nueve veces el peor caso
  # medido— y la cifra va con su fecha, como las de arriba, porque un número sin
  # fecha al lado envejece en silencio.
  #
  # OJO: esos 64 s son de ANTES de añadir la segunda pasada sobre el paquete
  # descargado, que corre los cuatro bancos otra vez. La cifra hay que volver a
  # medirla; hasta entonces ésta dice de cuándo es y qué NO incluye.
  windows:
    timeout-minutes: 10
    name: scripts de campo (Windows PowerShell 5.1)
    runs-on: windows-latest
    env:
      PWSH: powershell          # el 5.1 de Windows, NO el pwsh 7 que también está
      # LA SALIDA DE PYTHON, EN UTF-8. En Windows la stdout de Python es cp1252,
      # y los bancos imprimen «·», «á», «→»… Con cp1252 eso no es que salga feo:
      # es un UnicodeEncodeError que TUMBA el banco antes de decir nada. Pasó con
      # el bloque de diagnóstico, que se cayó justo donde tenía que explicar el
      # fallo. Esto es del entorno, no del banco: no cambia lo que comprueba
      # ninguno, y de paso los acentos salen legibles en el registro.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # node, para armar el ZIP con el mismo código que la página
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # SIN ESTO EL JOB PUEDE VOLVERSE UN DUPLICADO DEL DE ARRIBA sin que nadie
      # lo note: si algún día `powershell` apuntara a 7 en el runner, todo
      # seguiría en verde y ya no se estaría probando la versión de planta.
      - name: es Windows PowerShell 5.1, no pwsh 7
        shell: powershell
        run: |
          $v = $PSVersionTable.PSVersion
          Write-Host "$($PSVersionTable.PSEdition) $v"
          if ($v.Major -ne 5) { throw "se esperaba PowerShell 5.x y hay $v" }

      - name: ángulos del barrido (zigbee_angulos.ps1)
        run: python tools/test_angulos_barrido.py
      - name: inventario zigbee (zigbee_inventario.ps1)
        run: python tools/test_inventario_zb.py
      - name: RSSI (zigbee_logger.ps1)
        run: python tools/test_logger_rssi.py
      - name: rutas por telnet (zigbee_routes_logger.ps1)
        run: python tools/test_rutas_telnet.py
      - name: qué hace ESTE PowerShell con Export-Csv y la codificación
        run: python tools/test_export_csv_esquema.py

      # ── Y LOS MISMOS BANCOS SOBRE LO QUE SE DESCARGA ──────────────────────
      # El técnico NO usa el .ps1 del repo: usa el que sale del ZIP de «Medir en
      # planta», y no es el mismo fichero — el paquete le pone el BOM y le
      # sustituye el CONFIG. Probar solo el del repo dejaba fuera todas esas
      # transformaciones, y por ahí se coló que el BOM SE PERDÍA al empaquetar
      # (`Response.text()` lo quita al decodificar y `TextEncoder` no lo
      # escribe), así que `zigbee_inventario.ps1` seguía sin compilar en 5.1
      # aunque el fichero del repo estuviera arreglado.
      #
      # El ZIP lo arma `tools/paquete_planta.mjs` con el MISMO bloque de
      # index.html que usa la página, y lo abre `zipfile` de Python: que lo lea
      # otro programa es parte de la prueba.
      - name: el paquete que se descarga en planta
        shell: bash
        run: |
          node tools/paquete_planta.mjs elburgo _medir.zip
          python -c "import zipfile; zipfile.ZipFile('_medir.zip').extractall('_paq')"
          ls -l _paq/elburgo
      - name: los recolectores DEL PAQUETE, con PowerShell
        shell: bash
        env:
          PS1_DIR: _paq/elburgo
        run: |
          python tools/test_angulos_barrido.py
          python tools/test_inventario_zb.py
          python tools/test_logger_rssi.py
          python tools/test_rutas_telnet.py
      - name: y las mutaciones de los dos, en rojo
        shell: bash
        run: |
          log=$(mktemp)
          rojo () {
            banco="$1"; shift
            for m in "$@"; do
              set +e
              MUTA="$m" $PY "$banco" > "$log" 2>&1
              rc=$?
              set -e
              if [ "$rc" -ne 1 ]; then
                echo "::error::$banco con la mutación «$m» salió rc=$rc; se esperaba 1 (banco en rojo)"
                tail -40 "$log"
                exit 1
              fi
              echo "  $banco · $m: roja, bien"
            done
          }
          rojo tools/test_logger_rssi.py  signo rol filtro caido carga sello
          rojo tools/test_rutas_telnet.py saltos coord iac separador puerto
        env:
          PY: python

  # ── node sin navegador: layouts, mapas, física y paquetes de campo ────────
  datos:
    timeout-minutes: 30
    name: datos y física (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # NO se instala nada: el repo versiona node_modules con playwright 1.62.1
      # a propósito, y un `npm ci` aquí reescribiría un árbol que está
      # versionado. Estos bancos ni siquiera abren navegador.

      # De este módulo arranca toda la matriz de navegador: si resuelve mal la
      # ruta no falla un banco, fallan los nueve a la vez y con un error que no
      # señala ahí. Por eso se prueba, y se prueba aquí, que es lo barato.
      - name: la ruta del navegador se resuelve bien
        run: node tools/test_pw_navegador.mjs
      # La cifra anual pasa por el lazo y no puede volver a saltárselo: banco de
      # fuente y de conducta, con control negativo sobre el código de antes.
      - name: el anual pasa por el lazo de control
        run: node tools/test_anual_lazo.mjs
      # `nb` decide el escalón de la pérdida eléctrica y ninguna ficha de planta
      # lo trae: el banco vigila que la página DIGA de dónde sale, y que el día
      # que una ficha lo traiga se use (con planta sintética y control negativo).
      - name: nb dice de dónde sale
        run: node tools/test_nb_procedencia.mjs
      # La página publica LAS DOS métricas de POA de planta —por mesa y por
      # línea— en vez de elegir una en silencio según haya segTilt. Con control
      # negativo sobre el código de antes y test nulo de cada corte.
      - name: la página publica las dos métricas
        run: node tools/test_dos_metricas.mjs
      # La POA de planta pesa cada MESA por su largo, no cada LÍNEA por igual.
      # Con Ayora, siete de las nueve políticas casi no distinguen las dos
      # agregaciones, así que el banco empieza por un TEST NULO que exige que su
      # caso SÍ las distinga: un caso mal elegido pasaría con el código nuevo y
      # con el viejo y no protegería nada.
      - name: la planta pondera por largo de mesa
        run: node tools/test_ponderacion_planta.mjs
      # El signo de presentación (TH_DISP) decide con qué signo sale la consigna
      # que se manda al campo, y estaba escrito DOS veces como dos constantes
      # independientes. Ahora el exportador lo LEE de la página; este banco vigila
      # que nadie vuelva a copiarlo, con su control negativo.
      - name: el signo de presentación vive en un sitio
        run: node tools/test_signo_unico.mjs
      # `docs/algoritmos_backtracking.html` es prosa a mano: no se regenera desde
      # el código y decir que sí sería inventarlo. Lo que sí puede vigilarse es
      # que no se quede atrás EN SILENCIO, que es lo que pasó — declaraba la
      # v1.57.2 con el código en la v1.74.0, diecisiete versiones, ningún banco
      # mirando `docs/`. Este se pone rojo en cuanto `VER` se mueva sin que nadie
      # vuelva a contrastar. Coste de apagarlo honradamente: un minuto.
      - name: el documento no se queda atrás en silencio
        run: node tools/test_doc_version.mjs
      # Las dos herramientas de campo, que no estaban en CI. Ninguna llama a
      # `process.exit`: `careo_produccion` publica «veredicto: IDÉNTICOS» o su
      # contrario y SALE 0 en los dos casos, así que un `run:` pelado habría sido
      # verde garantizado. El banco lee lo que publican. Coste medido en esta
      # máquina: export con paso 30 → 48,6 s (con el paso 5 de campo son 280,6 s,
      # por eso aquí va el 30); careo → 95,5 s.
      - name: consignas de campo y careo con producción
        run: node tools/test_herramientas_campo.mjs
      - name: simulador de backtracking
        run: node tools/test_backtracking_sim.mjs
      - name: producción por string
        run: node tools/test_produccion.mjs
      - name: cableado
        run: node tools/test_cableado_core.mjs
      - name: lazo de control del tracker
        run: node tools/test_control_core.mjs
      # La aritmetica de tools/anual_motor.mjs: como se segmentan las maniobras
      # y con que modelo se cobra cada una. La MEDIDA anual cuesta 45 min y no
      # cabe aqui; estas dos cuentas, de las que cuelga su conclusion, si.
      # Su tercer bloque es un canario cruzado contra solargpt_core y aqui se
      # SALTA (el hermano no esta clonado), como el de las HSU: que conste que
      # en CI ese bloque no vigila nada, solo los otros dos.
      - name: aritmetica del consumo de motor
        run: node tools/test_anual_motor.mjs
      - name: sombras de nube
        run: node tools/test_cloud_shadows.mjs
      - name: cielo cubierto
        run: node tools/test_overcast_sim.mjs
      - name: mapa modbus
        run: node tools/test_modbus_map.mjs
      - name: paquete de medida
        run: node tools/test_paquete_medida.mjs
      # El PASO DE VUELTA del viaje a la planta: de los tres CSV al
      # <planta>_real.geojson. Antes lo hacia un `adaptador_elburgo.py` que no
      # existe en el repo, y por eso solo El Burgo tenia su malla.
      - name: la malla real, del CSV al GeoJSON
        run: node tools/test_malla_real.mjs
      - name: pilotes del DWG
        run: node tools/test_pilotes_dwg.mjs
      - name: CSV de meteo
        run: node tools/test_meteo_csv.mjs
      # Este se SALTA solo si no encuentra plantas/ de la toolbox del repo
      # `scada`, que aquí no está: en CI pasa en verde SIN COMPROBAR NADA. Se
      # deja porque el día que se monte el checkout cruzado empieza a servir,
      # pero que conste que hoy no vigila nada.
      - name: HSU contra la hoja (se salta sin la toolbox de scada)
        run: node tools/test_hsus_gw.mjs

  # ── el barrido de terrenos, que es el que BLOQUEA ─────────────────────────
  #
  # v1.57.2: el barrido existia desde v1.53 y NO LO CORRIA NADIE en CI. Se
  # construyo un gate (A, B, C, D, E, G, H con sol > 10°) que rompe con
  # `exit 1`, se publico v1.57.1 con las 18 comprobaciones en verde… y el
  # barrido sobre esa misma rama salia en rojo. Lo dijo el auditor externo con
  # todas las letras: «la CI no corre el barrido que bloquea, y eso es mas
  # importante que el propio θ, porque es el mecanismo que deja pasar todo lo
  # demas».
  #
  # DOS SEMILLAS, no una. La leccion de esa tanda es que el barrido de 8
  # configuraciones dio un verde falso y el de 40 lo destapo: con una sola
  # semilla se sigue muestreando, solo que mas. Van en matriz para que el rojo
  # diga cual sin abrir el log.
  #
  # Tiempo medido aqui: 40 configuraciones × 3 fechas × cada 20 min son ~16 min
  # con la maquina libre. El tope va en 45, como el visor.
  barrido:
    name: barrido de terrenos (semilla ${{ matrix.semilla }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        semilla: [1, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # el codigo de salida es el gate: `run:` ya falla con != 0, pero se deja
      # escrito para que nadie lo envuelva en un pipe y lo pierda por el camino
      # el numero de configuraciones va FIJADO aqui, no heredado del default del
      # script: si alguien cambia ese default, el gate se encogeria en silencio
      - name: invariantes sobre 40 configuraciones
        run: |
          set +e
          node tools/barrido_terrenos.mjs 40 ${{ matrix.semilla }}
          EXIT=$?
          set -e
          echo "barrido de terrenos · 40 configuraciones · semilla ${{ matrix.semilla }} · exit=$EXIT"
          if [ "$EXIT" -ne 0 ]; then
            echo "::error::el barrido de terrenos ha roto un invariante (exit $EXIT)"
            exit 1
          fi

      # Lo mismo aqui: ningun banco de datos debe dejar el arbol sucio.
      - name: los bancos no han tocado el repo
        run: |
          if ! git diff --quiet; then
            echo "Un banco ha modificado ficheros del repo:"; git diff --stat; exit 1
          fi

  # ── los que abren el visor: uno por job, para que el rojo diga cuál ───────
  navegador:
    # El tope NO es una previsión de lo que tarda: es el freno para un banco
    # colgado. Se pone por entrada porque `test_equipos` no juega en la misma
    # liga —35 min 17 s medidos en un runner malo, contra 95 s aquí— y un tope
    # ajustado a los demás lo que corta es una ejecución LENTA, no una colgada:
    # eso pone `main` en rojo sin que haya ningún defecto que arreglar.
    timeout-minutes: ${{ matrix.tope || 45 }}
    name: visor · ${{ matrix.nombre || matrix.banco }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # si cae el del terreno se quiere saber igual si pasa el del huso
      matrix:
        include:
          - { banco: test_terreno_plantas.mjs }
          - { banco: test_relieve_plantas.mjs }
          - { banco: test_relieve_bos.mjs }
          - { banco: test_suelo.mjs }
          # Las HSU son REPETIDORES, como todo equipo de esta red, y la suya es la antena
          # mejor colocada (6,50 m contra 3,15 de una NCU). Vigila una PROPIEDAD, no un
          # numero: añadir un repetidor no puede quitarle caminos a nadie. En El Burgo
          # mejora a 16 seguidores y no empeora a ninguno.
          - { banco: test_cobertura_hsu.mjs }
          - { banco: test_telemetria.mjs }
          - { banco: test_bt3d_rot.mjs }
          - { banco: test_afbt_mismo_tubo.mjs, arg: fayon }   # afeccion BT: el del mismo tubo es coplanar y no sombrea modulos (falla sin el arreglo)
          - { banco: test_huso_plantas.mjs }
          - { banco: test_panel_plegable.mjs }
          - { banco: test_plano_bifila.mjs }     # el visor 2D contando bífilas (Catania)
          - { banco: test_plantas_bifila.mjs }   # el accionamiento de cada planta sale de su layout: filaZ leido donde esta, y el caso mixto con layout sintetico
          - { banco: test_plano_zoom.mjs }       # ampliar el visor 2D: rueda, pinza y botones
          - { banco: test_malla_pagina.mjs }     # el boton que exporta la malla medida: los tres cargadores, el estado y la ida y vuelta del GeoJSON
          # La Cobertura Zigbee en LAS DIEZ plantas con NCU, y el Layout 2D de
          # cada una: que cargan, que pintan, que el encuadre cae sobre SU
          # planta y que las dos vistas dibujan el MISMO seguidor. La lista de
          # plantas sale de `plantas_indice.json`, no escrita a mano.
          #
          # Estaba escrito y no corria aqui, que es como se quedo afirmando que
          # el selector tenia siete opciones cuando tiene diez. 50 s medidos, o
          # sea que cabe de sobra en el tope general.
          - { banco: bench_cobertura_multi.mjs, nombre: 'bench_cobertura_multi.mjs · las 10 plantas con NCU' }
          # El contrato de datos v2: que el visor lea las dos versiones y que la hora NO se
          # invente. Incluye las dos noches del año en que convertir hora local a UTC no tiene
          # respuesta — la que no existio y la que ocurrio dos veces.
          - { banco: test_contrato_datos.mjs }
          # Las sombras: que TODOS los seguidores proyecten, suba o baje la camara, y
          # que la sombra salga OSCURA y no un gris lavado. Recorre la pagina DOS veces,
          # con user-agent de escritorio y de movil, porque son dos caminos distintos
          # (PCFSoft + 8192 contra PCF + 2048) y correr solo el primero fue justo lo que
          # dejo pasar la regresion del movil. Son dieciseis cuadros, con un mapa de
          # 8192x8192 pintado en software: 20 min 43 s medidos aqui, y con otra pasada
          # igual de pesada compitiendo por la CPU, asi que a solas baja bastante. De ahi
          # el tope propio y holgado, por lo mismo que `test_equipos`.
          - { banco: test_sombras.mjs, arg: elburgo, nombre: 'test_sombras.mjs · El Burgo', tope: 55 }
          # Nadie pide un mapa de sombra mayor del que declara la GPU. Abre las CUATRO
          # paginas 3D mintiendoles: parchea getParameter(MAX_TEXTURE_SIZE) a 2048 antes
          # de que three.js lea las capacidades. Lo que mide es si el codigo PREGUNTA,
          # que es el defecto, y por eso vale aunque el navegador de CI aguante 8192.
          - { banco: test_tope_mapa.mjs }
          - { banco: test_produccion_3d.mjs }   # se levanta su propio servidor
          - { banco: test_produccion_lazo.mjs } # idem — el lazo de control, las políticas y la tabla por minuto
          - { banco: test_render_sol.mjs }      # render ≡ física: desde el sol no se ve rojo · borde de sombra en 2D · signo del manual (servidor propio)
          # El informe gráfico: los seis campos del pie de cada gráfica, que
          # ningún porcentaje se pinte sin denominador y que la marca ámbar
          # salte —y NO salte— donde debe. Levanta su propio servidor.
          - { banco: test_informe_graf.mjs }
          # El certificado no se emite con datos de dos días: el guardián de
          # identidad del DAY, con su control negativo —desarmarlo tiene que
          # producir la mezcla— y la invariante de los consumidores síncronos.
          - { banco: test_certificado_dia.mjs }
          # El indicador «BT ON» dice backtracking, no deriva de lazo: compara
          # MANDOS y no salidas de lazo. Con su control negativo —revertir el
          # predicado a posiciones tiene que ponerlo rojo— y sus dos tests nulos.
          - { banco: test_indicador_bt.mjs }
          # `test_equipos` monta DOS escenas 3D pesadas y en runners compartidos
          # su tiempo es una loteria: 11 min 54 s en una ejecucion y mas de 44 en
          # la siguiente, con el mismo codigo. La variacion no esta en el banco,
          # esta en que maquina toque — y con las dos plantas juntas, un runner
          # malo se llevaba por delante la comprobacion de las dos. Partido, cada
          # planta corre en su propio runner y el rojo dice cual.
          #
          #   aqui        El Burgo   95 s  ·  Ayora  118 s
          #   en CI       El Burgo  35:17  ·  Ayora   13:09
          #
          # De ahi el `tope: 90`: con 45 el peor de los dos pasó por 9 minutos,
          # y ese margen no cubre una maquina peor todavia.
          - { banco: test_equipos.mjs, arg: elburgo, nombre: 'test_equipos.mjs · El Burgo', tope: 90 }
          - { banco: test_equipos.mjs, arg: ayora,   nombre: 'test_equipos.mjs · Ayora',    tope: 90 }
    env:
      PUERTO: 8124              # el convenio de todos los bancos; un servidor sirve a todos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # El binario del navegador NO está versionado (los .js de playwright sí).
      # Se instala con el CLI que ya trae el repo, así que la versión del
      # navegador la fija el playwright versionado y no una descarga suelta.
      - name: caché del navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.62.1
      - name: Chromium
        run: node_modules/.bin/playwright install --with-deps chromium

      # Sin ruta clavada: `tools/pw_navegador.mjs` no encuentra /opt/pw-browsers
      # aquí y devuelve undefined, que es como se le dice a Playwright «usa el
      # que acabas de instalar».
      - name: servidor estático
        run: |
          python3 -m http.server $PUERTO >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:$PUERTO/terreno.html && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:$PUERTO/terreno.html

      - name: ${{ matrix.banco }}
        # `matrix.arg` va vacio en los bancos que no se parten. Una planta que no
        # exista NO pasa en verde: el banco aborta con la lista de las que hay.
        run: node tools/${{ matrix.banco }} ${{ matrix.arg }}

  # ── LA PUERTA ─────────────────────────────────────────────────────────────
  # Un solo check que resume a TODOS, para que la proteccion de rama tenga
  # UNA casilla que marcar.
  #
  # Marcarlos a mano parece equivalente y no lo es: el dia que se renombre una
  # entrada de la matriz, el check con el nombre viejo deja de reportar y una PR
  # se queda bloqueada PARA SIEMPRE esperando algo que ya no existe. Con la
  # puerta, la matriz puede crecer o cambiar sin tocar los ajustes del repo.
  #
  # `if: always()` es imprescindible: sin el, la puerta se SALTA cuando algo
  # falla, y un check saltado no es un check rojo — la proteccion lo dejaria
  # pasar. Asi corre siempre y falla diciendo quien cayo.
  #
  # `result` de un job de matriz es success solo si TODAS sus entradas pasaron.
  puerta:
    name: bancos en verde
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [nucleo, powershell, windows, datos, barrido, navegador]
    # `always()` para que el gate corra aunque un banco falle —si no, un rojo se
    # volvería invisible—, pero `!cancelled()` para que NO corra cuando la corrida
    # entera se ha cancelado. Sin ese segundo trozo, `cancel-in-progress` deja los
    # bancos en `cancelled`, el bucle de abajo exige `success` y el PR enseña un
    # ROJO donde no ha fallado nada.
    #
    # MEDIDO sobre las 40 corridas completadas más recientes de este workflow:
    # 30 success · 10 cancelled · CERO failure. Una de cada cuatro salía en rojo
    # sin que hubiera fallado un solo banco, y esos rojos se confunden con los de
    # verdad — que es el coste real: un rojo que no significa nada enseña a no
    # mirar los rojos.
    #
    # Un `cancelled` por fail-fast de la matriz sigue cayendo: ahí la corrida NO
    # está cancelada, `!cancelled()` es cierto, el gate corre y el job que falló
    # de verdad aparece como `failure`.
    # Y MEDIDO QUE ESTO NO ABRE EL AGUJERO CONTRARIO. La objeción obvia: si un
    # banco se CUELGA y lo corta su `timeout-minutes`, ¿se salta también la
    # puerta y pasa en silencio lo que el tope existe para cazar? Se midió con
    # un experimento en el runner de este repo (rama desechable, ya borrada):
    # un job con `timeout-minutes: 1` haciendo `sleep 150`, un job sano, y una
    # puerta con exactamente esta condición. Resultado, del log:
    #
    #   lento.result = cancelled     ← cortado a los 72 s por su tope
    #   sano.result  = success
    #   LA PUERTA HA CORRIDO
    #
    # O sea: `cancelled()` es función del WORKFLOW, y un job muerto por su
    # propio tope no la pone cierta. La puerta corre, lee `cancelled` y su
    # `== success` la deja en ROJO. Lo que se salta es sólo la corrida que
    # alguien canceló de verdad empujando encima.
    if: always() && !cancelled()
    steps:
      - name: ninguno ha fallado
        run: |
          for j in "nucleo ${{ needs.nucleo.result }}" \
                   "powershell ${{ needs.powershell.result }}" \
                   "windows ${{ needs.windows.result }}" \
                   "datos ${{ needs.datos.result }}" \
                   "barrido ${{ needs.barrido.result }}" \
                   "navegador ${{ needs.navegador.result }}"; do echo "$j"; done
          if [ "${{ needs.nucleo.result }}"    != "success" ] || \
             [ "${{ needs.powershell.result }}" != "success" ] || \
             [ "${{ needs.windows.result }}"   != "success" ] || \
             [ "${{ needs.datos.result }}"     != "success" ] || \
             [ "${{ needs.barrido.result }}"   != "success" ] || \
             [ "${{ needs.navegador.result }}" != "success" ]; then
            echo "::error::hay bancos que no han pasado"
            exit 1
          fi
          echo "todos los bancos en verde"
