<style>

  .seg{display:flex;gap:4px;background:#0e141c;border:1px solid var(--line2);border-radius:8px;padding:3px}

           border:1px solid var(--line);border-radius:12px;padding:9px 14px;display:flex;align-items:center;gap:12px;

       font:11.5px/1.6 var(--mono);color:var(--tx);pointer-events:none;opacity:0;transition:opacity .12s;max-width:270px}

<body>
<canvas id="cv"></canvas>

<header>

  <span class="brand">Factiun</span>
</header>

<div class="panel">
  <h2>Backtracking</h2>
  <div class="seg" id="btmode">

<div id="tip"></div>

<script>
'use strict';
/* ============================================================================
 * 3D topográfico · Ayora
 * Cada fila se coloca con su COTA y su PENDIENTE MEDIDAS (no drapeadas de un DEM),
 * y el ángulo de basculación se calcula por fila con backtracking corregido por la
 * pendiente transversal del lado por el que viene el sol.
 * ==========================================================================*/
var DEG=Math.PI/180, D2=null, META=null, FIL=null;
var scene,camera,renderer,controls,SUN,HEMI,AMB,ground=null;
var SEGO=new THREE.Matrix4(), PLANS={}, GRP={}, MODS=[28,21,14];
var ui={bt:'3d',crit:'cons',shadow:true,kink:true,ground:true,det:'mass'};
var curMin=720, doy=355, playing=false, PLAYSPEED=90;
var raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2(), picker=null;

/* ---------- posición del sol (misma formulación que terreno.html) ---------- */
function tzOffMin(d){ return (d>=88&&d<=298)?120:60; }              // España peninsular: CEST / CET
function sunVec(min){
  var lat=META.lat*DEG;
  var decl=23.44*DEG*Math.sin(2*Math.PI*(doy-80)/365.24);
  var B=2*Math.PI*(doy-81)/364, EoT=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
  var H=((min-tzOffMin(doy)+META.lon*4+EoT)/60-12)*15*DEG;
  var sa=Math.sin(lat)*Math.sin(decl)+Math.cos(lat)*Math.cos(decl)*Math.cos(H);
  var el=Math.asin(Math.max(-1,Math.min(1,sa))), ce=Math.cos(el)||1e-6;
  var az=Math.atan2(-Math.cos(decl)*Math.sin(H)/ce,(Math.sin(decl)-Math.sin(lat)*sa)/(Math.cos(lat)*ce));
  return {el:el, az:az, E:Math.cos(el)*Math.sin(az), N:Math.cos(el)*Math.cos(az), U:Math.sin(el)};
}

/* ---------- ángulo de basculación de UNA fila ----------------------------- */
/* sl  = pendiente longitudinal del eje (%)   -> inclina el eje N-S
 * sx  = pendiente transversal hacia el lado del sol (%), positiva si la vecina
 *       que sombrea queda MÁS ALTA -> exige más backtracking
 * El límite ±55° es ABSOLUTO respecto a la horizontal y se aplica al final.   */
function anguloFila(sv, sl, sxE, sxO){
  if(sv.U<=0.02) return -5;                                   // dormido, mirando al este
  var b=Math.atan(sl/100);                                    // inclinación del eje
  var y=sv.N*Math.sin(b)+sv.U*Math.cos(b);                    // componente "arriba" en el marco del eje
  var R=-Math.atan2(sv.E,y);                                  // seguimiento verdadero, eje inclinado
  if(ui.bt==='off') return clamp55(R/DEG);
  var bc=0;
  if(ui.bt==='3d'){ var sx=(sv.E>0)?sxE:sxO; bc=Math.atan((sx||0)/100); }   // el sol al este -> sombrea la vecina del ESTE
  var dist=1/(META.gcr*Math.cos(bc));
  var temp=Math.min(dist*Math.cos(R-bc),1);
  var Rbt=R-(R<0?-1:1)*Math.acos(Math.max(-1,temp));
  return clamp55(Rbt/DEG);
}
function clamp55(a){ return Math.max(-55,Math.min(55,a)); }

/* ---------- escena --------------------------------------------------------- */
function init(){
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b0f14);
  scene.fog=new THREE.Fog(0x0b0f14, 900, 3200);
  camera=new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 12000);
  camera.position.set(180,240,320);   // se reencuadra en encuadra() cuando ya hay datos
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('cv'), antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  controls=new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0,0,0); controls.maxPolarAngle=Math.PI/2-0.02; controls.enableDamping=true;
  scene.fog=null;   // con 2,5 km de planta la niebla se comía el campo entero

  SUN=new THREE.DirectionalLight(0xfff2d4,2.6); SUN.castShadow=true;
  var hi=!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  SUN.shadow.mapSize.set(hi?4096:2048, hi?4096:2048);
  var c=SUN.shadow.camera; c.left=-260; c.right=260; c.top=260; c.bottom=-260; c.near=1; c.far=2400; c.updateProjectionMatrix();
  SUN.shadow.bias=-0.0003; SUN.shadow.normalBias=0.08; SUN.shadow.radius=hi?5:2;
  scene.add(SUN); scene.add(SUN.target);
  HEMI=new THREE.HemisphereLight(0xb6d2ff,0x33291a,0.45); scene.add(HEMI);
  AMB=new THREE.AmbientLight(0xffffff,0.08); scene.add(AMB);

  addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  renderer.domElement.addEventListener('pointermove', onMove);
}

function encuadra(){
  var x0=1e9,x1=-1e9,z0=1e9,z1=-1e9,y0=1e9,y1=-1e9;
  FIL.forEach(function(f){
    x0=Math.min(x0,f.x); x1=Math.max(x1,f.x);
    z0=Math.min(z0,f.zs,f.zn); z1=Math.max(z1,f.zs,f.zn);
    y0=Math.min(y0,f.ys,f.yn); y1=Math.max(y1,f.ys,f.yn);
  });
  var cx=(x0+x1)/2, cz=(z0+z1)/2, cy=(y0+y1)/2, R=Math.max(x1-x0,z1-z0)/2;
  controls.target.set(cx,cy,cz);
  camera.position.set(cx+R*0.55, cy+R*0.75, cz+R*1.15);
  camera.far=R*12; camera.updateProjectionMatrix();
  EXT={cx:cx,cy:cy,cz:cz,R:R};
  controls.update();
}
var EXT={cx:0,cy:0,cz:0,R:600};
function ajustaSombra(){
  // la sombra se ciñe a lo que ocupa la pantalla: con 2,5 km de planta un shadow
  // camera fijo de 260 m dejaba casi todo el campo sin sombra
  var d=camera.position.distanceTo(controls.target), r=Math.max(60,Math.min(EXT.R*1.2, d*0.55));
  var c=SUN.shadow.camera;
  if(Math.abs(c.right-r)<1) return;
  c.left=-r; c.right=r; c.top=r; c.bottom=-r; c.updateProjectionMatrix();
}

/* ---------- terreno: superficie interpolada de las cotas medidas ----------- */
function buildGround(){
  if(ground){ scene.remove(ground); ground.geometry.dispose(); ground=null; }
  var N=140, xs=[],zs=[];
  FIL.forEach(function(f){ xs.push(f.x); zs.push(f.zs,f.zn); });
  var x0=Math.min.apply(null,xs)-40, x1=Math.max.apply(null,xs)+40;
  var z0=Math.min.apply(null,zs)-40, z1=Math.max.apply(null,zs)+40;
  var g=new THREE.PlaneGeometry(x1-x0, z1-z0, N, N); g.rotateX(-Math.PI/2);
  g.translate((x0+x1)/2, 0, (z0+z1)/2);
  // rejilla de apoyo con las cotas del eje (celdas de 40 m) -> IDW local
  var C=40, grid={};
  FIL.forEach(function(f){
    for(var t=0;t<=1;t+=0.25){
      var X=f.x, Z=f.zs+(f.zn-f.zs)*t, Y=f.ys+(f.yn-f.ys)*t;
      var k=Math.round(X/C)+'_'+Math.round(Z/C);
      (grid[k]||(grid[k]=[])).push([X,Z,Y]);
    }
  });
  var pos=g.attributes.position;
  for(var i=0;i<pos.count;i++){
    var X=pos.getX(i), Z=pos.getZ(i), sw=0, sv=0;
    var cx=Math.round(X/C), cz=Math.round(Z/C);
    for(var a=cx-2;a<=cx+2;a++) for(var b=cz-2;b<=cz+2;b++){
      var arr=grid[a+'_'+b]; if(!arr) continue;
      for(var k2=0;k2<arr.length;k2++){
        var dx=arr[k2][0]-X, dz=arr[k2][1]-Z, d2=dx*dx+dz*dz+1;
        var w=1/(d2*d2); sw+=w; sv+=w*arr[k2][2];
      }
    }
    pos.setY(i, (sw>0? sv/sw : 0) - 1.6);       // el terreno, 1,6 m bajo el eje
  }
  g.computeVertexNormals();
  ground=new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:0x6b5f47, roughness:0.96, metalness:0.0}));
  ground.receiveShadow=true; ground.visible=ui.ground; scene.add(ground);
}

/* ---------- seguidores ----------------------------------------------------- */
function buildTrackers(){
  Object.keys(GRP).forEach(function(k){ scene.remove(GRP[k].root); });
  GRP={}; PLANS={};
  var mats=Seguidor.materials(THREE);
  var D=Seguidor.DIMS;
  D.modW=META.modW; D.gapMod=META.gapMod; D.gapDrive=META.gapDrive;
  D.pitch=D.modW+D.gapMod;
  MODS.forEach(function(n){
    Seguidor.setModsPerStr(n);
    var filas=FIL.filter(function(f){ return f.mods===n; });
    if(!filas.length) return;
    // las articuladas se dibujan como DOS medios tubos (un ala cada uno) para poder quebrarlas
    var rectas=filas.filter(function(f){ return !f.art; });
    var plan=Seguidor.instancePlan(THREE,{detail:ui.det, size:'largo'});
    var root=new THREE.Group(); scene.add(root);
    var meshes=plan.map(function(p){
      var im=new THREE.InstancedMesh(p.geom(THREE), mats[p.mat], Math.max(1,filas.length*p.locals.length));
      im.castShadow=!!p.cast; im.receiveShadow=true; im.frustumCulled=false; root.add(im);
      return {p:p, im:im};
    });
    GRP[n]={root:root, meshes:meshes, filas:filas, plan:plan};
  });
  // picker invisible: una caja por fila, para hover
  if(picker){ scene.remove(picker); }
  var pg=new THREE.BoxGeometry(1,1,1);
  picker=new THREE.InstancedMesh(pg, new THREE.MeshBasicMaterial({visible:false}), FIL.length);
  picker.frustumCulled=false; scene.add(picker);
  var m=new THREE.Matrix4(), q=new THREE.Quaternion();
  FIL.forEach(function(f,i){
    var L=Math.abs(f.zn-f.zs);
    m.makeTranslation(f.x, (f.ys+f.yn)/2, (f.zs+f.zn)/2);
    m.scale(new THREE.Vector3(META.cuerda, 1.2, L));
    picker.setMatrixAt(i,m);
  });
  picker.instanceMatrix.needsUpdate=true;
}

/* ---------- colocación y basculación por frame ----------------------------- */
var _M=new THREE.Matrix4(), _B=new THREE.Matrix4(), _R=new THREE.Matrix4(), _T=new THREE.Matrix4(), _S=new THREE.Matrix4();
function baseFila(f, alaSlope, zMid, yMid){
  // marco canónico del seguidor: +X a lo largo del tubo. El tubo va N-S -> rotar Y 90°.
  // luego inclinar el eje con su pendiente (giro sobre el eje transversal del mundo).
  var b=Math.atan(alaSlope/100);
  _B.makeTranslation(f.x, yMid, zMid);
  _T.makeRotationY(Math.PI/2);                  // canónico (tubo X) -> mundo (tubo Z)
  _B.multiply(_T);
  _T.makeRotationZ(-b);                          // inclinación longitudinal del eje
  _B.multiply(_T);
  return _B;
}
function updateFrame(){
  var sv=sunVec(curMin);
  var d=Math.max(0.05,sv.U);
  var Rs=Math.max(900,EXT.R*1.6);
  SUN.position.set(EXT.cx+sv.E*Rs, EXT.cy+Math.max(40,sv.U*Rs), EXT.cz-sv.N*Rs);
  SUN.target.position.set(EXT.cx,EXT.cy,EXT.cz); SUN.target.updateMatrixWorld();
  ajustaSombra();
  SUN.intensity=2.6*Math.max(0,Math.min(1,(sv.U+0.05)/0.35));
  HEMI.intensity=0.18+0.35*Math.max(0,sv.U);
  SUN.castShadow=ui.shadow && sv.U>0.02;
  var f, i, gi, g, k, im, ang, ali, nAlas, sxE, sxO;
  for(k in GRP){
    g=GRP[k];
    for(gi=0;gi<g.meshes.length;gi++){
      var mm=g.meshes[gi], p=mm.p, n=p.locals.length, c=0;
      for(i=0;i<g.filas.length;i++){
        f=g.filas[i];
        sxE=(ui.crit==='cons')?f.cse:f.ase;
        sxO=(ui.crit==='cons')?f.cso:f.aso;
        nAlas=(ui.kink && f.art)?2:1;
        for(ali=0; ali<nAlas; ali++){
          var sl=(nAlas===2)? f.pa[ali] : f.sl;
          ang=anguloFila(sv, sl, sxE, sxO);
          var zMid, yMid;
          if(nAlas===2){
            if(ali===0){ zMid=(f.zs+f.zm)/2; yMid=(f.ys+f.ym)/2; }
            else       { zMid=(f.zm+f.zn)/2; yMid=(f.ym+f.yn)/2; }
          } else { zMid=(f.zs+f.zn)/2; yMid=(f.ys+f.yn)/2; }
          var base=baseFila(f, sl, zMid, yMid);
          for(var li=0; li<n; li++){
            _M.copy(base);
            if(p.spin){ _R.makeRotationX(-ang*DEG); _M.multiply(_R); }
            _M.multiply(p.locals[li]);
            if(nAlas===2){ /* media longitud: el plan 'largo' cubre las dos alas; se escala en X */
              _S.makeScale(0.5,1,1); }
            mm.im.setMatrixAt(c++, _M);
          }
        }
      }
      mm.im.count=c; mm.im.instanceMatrix.needsUpdate=true;
    }
  }
  // reloj y datos del sol
  var hh=Math.floor(curMin/60), mm2=Math.round(curMin%60);
  document.getElementById('clock').textContent=(hh<10?'0':'')+hh+':'+(mm2<10?'0':'')+mm2;
  document.getElementById('suninfo').textContent='alt '+(sv.el/DEG).toFixed(1)+'° · az '+(((sv.az/DEG)+360)%360).toFixed(0)+'°';
}

/* ---------- hover ---------------------------------------------------------- */
function onMove(e){
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  var hit=raycaster.intersectObject(picker,false);
  var tip=document.getElementById('tip');
  if(!hit.length){ tip.style.opacity=0; return; }
  var f=FIL[hit[0].instanceId]; if(!f){ tip.style.opacity=0; return; }
  var sv=sunVec(curMin);
  var sxE=(ui.crit==='cons')?f.cse:f.ase, sxO=(ui.crit==='cons')?f.cso:f.aso;
  var ang=anguloFila(sv, f.sl, sxE, sxO);
  tip.innerHTML='<b>'+f.id+'</b> · '+f.tp+' · '+f.mods+' mód/ala'
    +'<br>pend. eje '+f.sl.toFixed(3)+' %'+(f.art?' · <span class="warn">articulada</span>':'')
    +(f.art?'<br>alas '+f.pa[0].toFixed(2)+' % / '+f.pa[1].toFixed(2)+' %':'')
    +'<br>transv. E '+(f.cse==null?'—':f.cse.toFixed(2)+' %')+' · O '+(f.cso==null?'—':f.cso.toFixed(2)+' %')
    +'<br>ángulo ahora <b>'+ang.toFixed(1)+'°</b>';
  tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px'; tip.style.opacity=1;
  document.getElementById('pick').innerHTML=tip.innerHTML;
}

/* ---------- interfaz -------------------------------------------------------- */
var BTH={off:'Seguimiento puro: la fila sigue al sol y topa en ±55°. Al amanecer y al atardecer se sombrean unas a otras.',
         flat:'Backtracking clásico de terreno plano, como en El Burgo. Ignora la pendiente transversal.',
         '3d':'Backtracking corregido: usa la pendiente transversal del lado por el que viene el sol, individual de cada fila.'};
function bindUI(){
  document.querySelectorAll('#btmode button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('#btmode button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); ui.bt=b.dataset.m; document.getElementById('btHelp').textContent=BTH[ui.bt];
    };
  });
  document.getElementById('btHelp').textContent=BTH['3d'];
  document.getElementById('crit').onchange=function(e){ ui.crit=e.target.value; };
  document.getElementById('chkShadow').onchange=function(e){ ui.shadow=e.target.checked; };
  document.getElementById('chkKink').onchange=function(e){ ui.kink=e.target.checked; };
  document.getElementById('chkGround').onchange=function(e){ ui.ground=e.target.checked; if(ground)ground.visible=ui.ground; };
  document.getElementById('det').onchange=function(e){ ui.det=e.target.value; buildTrackers(); };
  var t=document.getElementById('time');
  t.oninput=function(){ curMin=+t.value; };
  document.getElementById('play').onclick=function(){ playing=!playing; this.textContent=playing?'❚❚':'▶'; };
  var dslider=document.getElementById('doy');
  function setDoy(v){ doy=+v; dslider.value=v; document.querySelector('#doyLbl b').textContent=fechaDe(doy); }
  dslider.oninput=function(){ setDoy(dslider.value); };
  document.querySelectorAll('[data-doy]').forEach(function(b){ b.onclick=function(){ setDoy(b.dataset.doy); }; });
  setDoy(doy);
}
function fechaDe(d){
  var ms=new Date(Date.UTC(2026,0,1)).getTime()+(d-1)*86400000, f=new Date(ms);
  var M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return f.getUTCDate()+' '+M[f.getUTCMonth()];
}

/* ---------- arranque -------------------------------------------------------- */
fetch('ayora_asbuilt.json').then(function(r){return r.json();}).then(function(j){
  D2=j; META=j.meta; FIL=j.f;
  document.getElementById('kTrk').textContent=META.n_trk+' · '+META.n_filas;
  document.getElementById('kArt').textContent=(META.n_art/2)+' bifilas';
  document.getElementById('kGeo').textContent=META.pitch.toFixed(2)+' m · '+META.cuerda.toFixed(3)+' m';
  document.getElementById('kGcr').textContent=META.gcr.toFixed(4);
  init(); buildGround(); buildTrackers(); encuadra(); bindUI();
  var last=performance.now();
  (function loop(now){
    requestAnimationFrame(loop);
    var dt=(now-last)/1000; last=now;
    if(playing){ curMin+=dt*PLAYSPEED; if(curMin>1200) curMin=240; document.getElementById('time').value=curMin; }
    controls.update(); updateFrame(); renderer.render(scene,camera);
  })(performance.now());
}).catch(function(e){
  document.getElementById('pick').innerHTML='<span class="warn">No se pudo cargar ayora_asbuilt.json</span><br>'+e;
});
</script>
